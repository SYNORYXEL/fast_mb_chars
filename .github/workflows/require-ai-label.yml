name: require-ai-label

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Require and record AI contribution label
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              'AI-100',
              'AI-MOSTLY',
              'AI-PARTIAL',
              'AI-ASSISTED',
              'HUMAN',
              'OTHER',
            ];
            const pr = context.payload.pull_request;
            const labels = pr.labels.map((l) => l.name);
            const matched = required.filter((name) => labels.includes(name));

            const selectedText =
              matched.length === 1
                ? `**Selected:** \`${matched[0]}\``
                : '**Selected:** _none yet — pick a label on the right_';
            const block =
              `<!-- ai-contribution-selected -->\n${selectedText}\n<!-- /ai-contribution-selected -->`;
            const body = pr.body || '';
            const re =
              /<!-- ai-contribution-selected -->[\s\S]*?<!-- \/ai-contribution-selected -->/;
            const nextBody = re.test(body)
              ? body.replace(re, block)
              : body.replace(
                  /## AI contribution\s*\n/,
                  `## AI contribution\n\n${block}\n\n`
                );

            if (nextBody !== body) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: nextBody,
              });
            }

            if (matched.length !== 1) {
              core.setFailed(
                matched.length === 0
                  ? `Add exactly one AI contribution label: ${required.join(', ')}`
                  : `Use only one AI contribution label (found: ${matched.join(', ')})`
              );
            }

  record-on-merge:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Comment AI contribution used for this merge
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              'AI-100',
              'AI-MOSTLY',
              'AI-PARTIAL',
              'AI-ASSISTED',
              'HUMAN',
              'OTHER',
            ];
            const pr = context.payload.pull_request;
            const matched = pr.labels
              .map((l) => l.name)
              .filter((name) => required.includes(name));
            const value =
              matched.length === 1 ? `\`${matched[0]}\`` : '_no AI contribution label_';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `### AI contribution (merged)\n\nThis PR was merged with label: ${value}`,
            });
