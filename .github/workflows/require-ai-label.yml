name: require-ai-label

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require one AI contribution label
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              'AI-100',
              'AI-MOSTLY',
              'AI-PARTIAL',
              'AI-ASSISTED',
              'HUMAN',
              'OTHER',
            ];
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            const matched = required.filter((name) => labels.includes(name));
            if (matched.length !== 1) {
              core.setFailed(
                matched.length === 0
                  ? `Add exactly one AI contribution label: ${required.join(', ')}`
                  : `Use only one AI contribution label (found: ${matched.join(', ')})`
              );
            }
